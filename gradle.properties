# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# Match the proven working environment (entity_modifier uses 26.1.2.87); the built jar
# declares versionRange [26.1.2.87,) so it also runs on newer 26.1.2 hotfixes (e.g. .94).
neo_version=26.1.2.87

## Mod Properties
# The unique mod identifier. Must be lowercase, fit [a-z][a-z0-9_]{1,63}, and match @Mod(MODID).
mod_id=eden
# NOTE: keep ASCII-only. Gradle reads gradle.properties as ISO-8859-1 which corrupts Chinese.
# The Chinese displayName/description are hardcoded in src/main/templates/META-INF/neoforge.mods.toml.
mod_name=Eden Protocol
mod_license=LGPL-3.0-or-later
mod_version=0.3.0-alpha
mod_group_id=com.srqingchen.eden

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Aliyun mirrors - faster dependency downloads (China)
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/central' }
    // Local mod jars
    flatDir {
        dir 'libs'
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Default run configurations.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Curios API - REQUIRED by the card system (compile + dev runtime; provided by modpack in production).
    implementation files("libs/curios-neoforge-15.0.0+26.1.2.jar")

    // Sophisticated Backpacks/Core - OPTIONAL (compileOnly), guarded by ModList.isLoaded("sophisticatedbackpacks").
    // Used only for end-of-raid salvage recovery of backpack contents; never consumed the backpack item itself.
    compileOnly files("libs/sophisticatedcore-26.1.2-1.5.0.2320.jar")
    compileOnly files("libs/sophisticatedbackpacks-26.1.2-3.26.1.2130.jar")

    // Just Enough Characters (通用拼音搜索) - OPTIONAL (compileOnly), referenced only through JechCompat which
    // is guarded by ModList.isLoaded("jecharacters"); falls back to substring search when the mod is absent.
    compileOnly files("libs/jecharacters-26.1.2-neoforge-4.6.4.jar")

    // Patchouli (帕秋莉手册) - OPTIONAL (compileOnly), guarded by ModList.isLoaded("patchouli");
    // powers the in-game guide book. The book itself is pure datapack JSON (no code needed without it).
    compileOnly files("libs/patchouli-neoforge-26.1-94.jar")

    // entity_modifier - REQUIRED hard dependency (difficulty config profiles + the unique polluted-mob drops:
    // samples / taint crystal / locator). compileOnly here (the modpack provides it in production); declared
    // mandatory in neoforge.mods.toml. Referenced directly via com.entitymodifier.data.ConfigProfileManager.
    compileOnly files("libs/entity_modifier-3.4.2.jar")

    // Dev runs only (runServer/runClient): the hard dependency above must be present on the dev runtime
    // classpath; production keeps it modpack-provided. localRuntime feeds runtimeClasspath only.
    localRuntime files("libs/entity_modifier-3.4.2.jar")

    // FTB Quests (tech tree) is integrated via reflection / ModList.isLoaded guards and wired in later
    // milestones, so it is NOT a compile dependency here.
}

// This block expands all declared replace properties in the specified resource targets.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    // Force UTF-8 so Chinese displayName/description hardcoded in neoforge.mods.toml survive expansion.
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Ensure all resource copying (including lang files and mod metadata) uses UTF-8
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
